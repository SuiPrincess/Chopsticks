name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  localization:
    name: Localization coverage (JP keys ⇄ EN translations)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify translation coverage and .strings generation
        run: |
          python3 tools/localization/gen_localization.py
          git diff --exit-code -- Chopsticks/en.lproj Chopsticks/ja.lproj \
            || { echo "::error::.strings files are stale — run tools/localization/gen_localization.py"; exit 1; }

  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ランナー標準のXcodeを使う（Xcode_16.2を強制するとiOSシミュレータの
      # プラットフォームランタイムが未インストールでdestination解決に失敗する）
      - name: Show Xcode version
        run: xcode-select -p && xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | sed 's/ *$//')
          DEVICE="${DEVICE:-iPhone 16}"
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # tailにパイプするとエラー行が流れて見えなくなるため、全ログを保存して
      # 失敗時はerror行を抽出して表示する
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Chopsticks/Chopsticks.xcodeproj \
            -scheme Chopsticks \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            > xcodebuild.log 2>&1 || {
              echo "=== errors ==="
              grep -E " error:|BUILD FAILED|TEST FAILED|Failing tests|fatal error|Assertion" -A 3 xcodebuild.log | head -300
              echo "=== last 80 lines ==="
              tail -80 xcodebuild.log
              exit 1
            }
          echo "=== summary (last 40 lines) ==="
          tail -40 xcodebuild.log
