name: Chopsticks
options:
  bundleIdPrefix: com.suiprincess
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: ja

targets:
  Chopsticks:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj/**"
          - "ChopsticksTests/**"
          - Info.plist
    settings:
      base:
        # Info.plist（配列やロック画面設定など）を基に、必要なキーだけをビルド設定で補う
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.suiprincess.chopsticks
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: GUH7SP89Y7
        CODE_SIGN_ENTITLEMENTS: Chopsticks.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPadのレイアウトは未対応のためiPhoneのみ（iPadではiPhoneアプリとして動作）
        TARGETED_DEVICE_FAMILY: "1"

  ChopsticksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChopsticksTests
    dependencies:
      - target: Chopsticks
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.suiprincess.chopsticks.tests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: GUH7SP89Y7
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Chopsticks:
    build:
      targets:
        Chopsticks: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ChopsticksTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
